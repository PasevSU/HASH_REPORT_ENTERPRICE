[pytest]
# ChronoSeal Enterprise - test discovery and determinism (v5.11.0).
#
# Added so that `pytest` run from the repository root collects exactly the two
# test trees the project owns. Before this file existed, root-level `pytest`
# could also pick up ad-hoc probe scripts dropped into the working tree.
#
# `npm test` (unittest discover) remains the canonical runner; this file only
# makes the developer-facing `pytest` invocation agree with it.

testpaths =
    tests
    hash_report_generator/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep the suite single-process and deterministically ordered. One flaky test
# (`tests/test_bridge_contract.py`) is timing-sensitive: it shells out to
# OpenSSL and Node with a 20 s timeout, so parallel workers on a network share
# can starve it. Serial execution removes that class of false failure.
addopts = -p no:randomly --strict-markers

# Surface the short reason for every skip/failure without dumping full diffs
# for this large suite.
filterwarnings =
    default
